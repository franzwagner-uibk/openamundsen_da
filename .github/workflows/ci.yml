name: CI and Publish

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "examples/README.md"
      - "tests/README.md"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/franzwagner-uibk/openamundsen_da
  CI_IMAGE_NAME: openamundsen-da-ci

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff Lint
    # Never run untrusted fork code on self-hosted infrastructure.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: [self-hosted, linux, x64, oa-da]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ruff (fatal checks)
        run: |
          bash scripts/ci/run_lint.sh

  tests:
    name: Unit and Integration Tests
    # Never run untrusted fork code on self-hosted infrastructure.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    needs: [lint]
    runs-on: [self-hosted, linux, x64, oa-da]
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect docs-only pull request
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          docs_only=false

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            changed_files="$(git diff --name-only "origin/${{ github.base_ref }}"..HEAD)"

            {
              echo "### Changed files"
              echo
              if [[ -n "${changed_files}" ]]; then
                printf '%s\n' "${changed_files}" | sed 's/^/- `/' | sed 's/$/`/'
              else
                echo "_No changed files detected._"
              fi
              echo
            } >> "${GITHUB_STEP_SUMMARY}"

            if [[ -n "${changed_files}" ]] && ! grep -Ev '^(docs/|README\.md$|examples/README\.md$|tests/README\.md$|\.github/workflows/deploy-docs\.yml$)' <<< "${changed_files}" >/dev/null; then
              docs_only=true
            fi
          fi

          echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
          echo "docs_only=${docs_only}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Build docs (docs-only PR)
        if: ${{ steps.changes.outputs.docs_only == 'true' }}
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "${PWD}/docs:/docs" \
            -w /docs \
            ruby:3.1 bash -lc \
            'set -e; gem install bundler --no-document; BUNDLE_PATH=/tmp/bundle bundle install; JEKYLL_ENV=production BUNDLE_PATH=/tmp/bundle bundle exec jekyll build; chown -R "${HOST_UID}:${HOST_GID}" /docs/_site /docs/.jekyll-cache 2>/dev/null || true'
          {
            echo
            echo "Docs-only pull request detected."
            echo "Built the Jekyll docs and skipped the CI image build, unit tests and integration tests."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build CI image
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        run: |
          docker build -t "${CI_IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Run unit tests
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        run: |
          CI_IMAGE="${CI_IMAGE_NAME}:${GITHUB_SHA}" \
          bash scripts/ci/run_unit_tests.sh

      - name: Validate installed wheel interface
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        run: |
          CI_IMAGE="${CI_IMAGE_NAME}:${GITHUB_SHA}" \
          bash scripts/ci/run_wheel_smoke.sh

      - name: Run integration tests (derived Rofental fast path)
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        run: |
          CI_IMAGE="${CI_IMAGE_NAME}:${GITHUB_SHA}" \
          OA_DA_TEST_MAX_WORKERS=8 \
          OA_DA_TEST_SETUP_RESOLUTION=500 \
          OA_DA_TEST_ENSEMBLE_SIZE=2 \
          CI_ARTIFACT_DIR="${{ github.workspace }}/.ci-artifacts/integration/single-domain" \
          bash scripts/ci/run_integration_tests.sh

      - name: Run integration tests (trimmed North Tyrol sub-domain)
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        run: |
          CI_IMAGE="${CI_IMAGE_NAME}:${GITHUB_SHA}" \
          OA_DA_SUBDOMAIN_TEST_MAX_WORKERS=8 \
          OA_DA_SUBDOMAIN_TEST_INNER_WORKERS=4 \
          CI_ARTIFACT_DIR="${{ github.workspace }}/.ci-artifacts/integration/sub-domain" \
          bash scripts/ci/run_integration_tests_subdomain.sh

      - name: Run integration tests (trimmed North Tyrol openAMUNDSEN model sub-domain)
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        run: |
          CI_IMAGE="${CI_IMAGE_NAME}:${GITHUB_SHA}" \
          OA_DA_MODEL_SUBDOMAIN_TEST_MAX_WORKERS=8 \
          CI_ARTIFACT_DIR="${{ github.workspace }}/.ci-artifacts/integration/model-sub-domain" \
          bash scripts/ci/run_integration_tests_model_subdomain.sh

      - name: Upload integration artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/integration
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Build and Push GHCR Image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [tests]
    runs-on: [self-hosted, linux, x64, oa-da]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image tags
        run: |
          DATE_TAG="main-$(date +%Y%m%d)"
          SHA_TAG="${GITHUB_SHA::7}"
          docker build -t "${IMAGE}:${DATE_TAG}" -t "${IMAGE}:${SHA_TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${DATE_TAG}"
          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:latest"
