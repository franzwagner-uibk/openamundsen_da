name: CI and Publish

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  push:
    branches:
      - "**"
    paths-ignore:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/franzwagner-uibk/openamundsen_da
  CI_IMAGE_NAME: openamundsen-da-ci

jobs:
  lint:
    name: Ruff Lint
    # Never run untrusted fork code on self-hosted infrastructure.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: [self-hosted, linux, x64, oa-da]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ruff (fatal checks)
        run: |
          bash scripts/ci/run_lint.sh

  tests:
    name: Unit and Integration Tests
    # Never run untrusted fork code on self-hosted infrastructure.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    needs: [lint]
    runs-on: [self-hosted, linux, x64, oa-da]
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CI image
        run: |
          docker build -t "${CI_IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Run unit tests
        run: |
          CI_IMAGE="${CI_IMAGE_NAME}:${GITHUB_SHA}" \
          bash scripts/ci/run_unit_tests.sh

      - name: Run integration tests (trimmed Rofental)
        run: |
          CI_IMAGE="${CI_IMAGE_NAME}:${GITHUB_SHA}" \
          OA_DA_TEST_MAX_WORKERS=20 \
          CI_ARTIFACT_DIR="${{ github.workspace }}/.ci-artifacts/integration/single-domain" \
          bash scripts/ci/run_integration_tests.sh

      - name: Run integration tests (trimmed Rofental sub-domain)
        run: |
          CI_IMAGE="${CI_IMAGE_NAME}:${GITHUB_SHA}" \
          OA_DA_SUBDOMAIN_TEST_MAX_WORKERS=3 \
          OA_DA_SUBDOMAIN_TEST_INNER_WORKERS=2 \
          CI_ARTIFACT_DIR="${{ github.workspace }}/.ci-artifacts/integration/sub-domain" \
          bash scripts/ci/run_integration_tests_subdomain.sh

      - name: Upload integration artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/integration
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Build and Push GHCR Image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [tests]
    runs-on: [self-hosted, linux, x64, oa-da]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image tags
        run: |
          DATE_TAG="main-$(date +%Y%m%d)"
          SHA_TAG="${GITHUB_SHA::7}"
          docker build -t "${IMAGE}:${DATE_TAG}" -t "${IMAGE}:${SHA_TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${DATE_TAG}"
          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:latest"
