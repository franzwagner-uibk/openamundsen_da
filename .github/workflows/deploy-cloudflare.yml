name: Deploy Docs to Cloudflare Pages (gated fallback)

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'openamundsen_da/cli.py'
      - 'scripts/ci/validate_docs.py'
      - 'scripts/docs/**'
      - 'tests/baselines/rofental_es30_tutorial_assets.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Validate documentation contracts
        run: python scripts/ci/validate_docs.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1.318.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: docs

      - name: Build Jekyll site
        working-directory: docs
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --trace
          test ! -e _site/README.md
          test ! -e _site/assets/images/tutorial/scheme_oa_da.png

      - name: Deploy to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/_site --project-name=openamundsen-da --branch=main --commit-dirty=true

      - name: Output deployment URL
        run: echo "Deployed to ${{ steps.cloudflare.outputs.deployment-url }}"
