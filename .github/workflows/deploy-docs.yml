name: Deploy Docs to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'openamundsen_da/cli.py'
      - 'scripts/ci/validate_docs.py'
      - 'scripts/docs/**'
      - 'tests/baselines/rofental_es30_manuscript_assets.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Validate documentation contracts
        run: |
          python scripts/ci/validate_docs.py

      - name: Setup Ruby
        uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1.318.0
        with:
          ruby-version: '3.1'
          bundler-cache: false

      - name: Install Jekyll dependencies
        run: |
          cd docs
          gem install bundler
          bundle config set --local path 'vendor/bundle'
          bundle install

      - name: Build Jekyll site
        run: |
          cd docs
          bundle exec jekyll build
          test ! -e _site/README.md
          test ! -e _site/assets/images/tutorial/scheme_oa_da.png
        env:
          JEKYLL_ENV: production

      - name: Deploy to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/_site --project-name=openamundsen-da --branch=main --commit-dirty=true

      - name: Output deployment URL
        run: echo "Deployed to ${{ steps.cloudflare.outputs.deployment-url }}"
