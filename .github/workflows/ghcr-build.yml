# Build and publish container images to GHCR on main.
# Requires repo secret: GHCR_PAT with write:packages.

name: Build and push to GHCR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/franzwagner-uibk/openamundsen_da

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set tags
        id: vars
        run: |
          DATE_TAG="main-$(date +%Y%m%d)"
          SHA_TAG="${GITHUB_SHA::7}"
          echo "date_tag=$DATE_TAG" >> $GITHUB_OUTPUT
          echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.date_tag }}
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_tag }}
            ${{ env.IMAGE }}:latest

      - name: Verify runtime user and bind-mount ownership
        run: |
          set -euo pipefail
          IMG="${{ env.IMAGE }}:${{ steps.vars.outputs.sha_tag }}"

          docker pull "$IMG"
          IMAGE_USER="$(docker image inspect "$IMG" --format '{{.Config.User}}')"
          if [ "$IMAGE_USER" != "root" ]; then
            echo "Expected default image user 'root', got '$IMAGE_USER'"
            exit 1
          fi

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          EXPECTED_OWNER="$(stat -c '%u:%g' "$TMP_DIR")"

          docker run --rm -v "$TMP_DIR:/data" "$IMG" bash -lc "touch /data/ownership_probe"
          ACTUAL_OWNER="$(stat -c '%u:%g' "$TMP_DIR/ownership_probe")"

          if [ "$ACTUAL_OWNER" != "$EXPECTED_OWNER" ]; then
            echo "Expected /data ownership $EXPECTED_OWNER, got $ACTUAL_OWNER"
            exit 1
          fi
