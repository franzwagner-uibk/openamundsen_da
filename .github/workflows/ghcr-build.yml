# Build and publish container images to GHCR on main.
# Requires repo secret: GHCR_PAT with write:packages.

name: Build and push to GHCR

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/franzwagner-uibk/openamundsen_da

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set tags
        id: vars
        run: |
          DATE_TAG="main-$(date +%Y%m%d)"
          SHA_TAG="${GITHUB_SHA::7}"
          echo "date_tag=$DATE_TAG" >> $GITHUB_OUTPUT
          echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.date_tag }}
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_tag }}
            ${{ env.IMAGE }}:latest
