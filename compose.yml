services:
  oa:
    image: ${IMAGE:-ghcr.io/openamundsen/openamundsen-da:0.9.1}
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /data
    volumes:
      - ${PROJ:-./examples/rofental}:/data
      - oa_cache:/cache
    environment:
      XDG_CACHE_HOME: /cache/xdg
      MAMBA_PKGS_DIRS: /cache/mamba/pkgs
      MPLCONFIGDIR: /cache/mpl
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
      # Prefer Fiona over pyogrio for robust vector I/O.
      # Newer GeoPandas honours GPD_USE_PYOGRIO=0 to disable pyogrio.
      GPD_USE_PYOGRIO: "0"
    # This service intentionally has no default command.
    # Use `docker compose run --rm oa <your command>` to execute tasks.
volumes:
  oa_cache:
