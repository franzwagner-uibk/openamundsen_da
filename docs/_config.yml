# Just the Docs configuration
title: oA-DA
description: Data Assimilation Framework for openAMUNDSEN
remote_theme: just-the-docs/just-the-docs@v0.4.0
url: https://openamundsen-da.pages.dev
baseurl: ""

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag

# Theme settings
color_scheme: light
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation structure
nav_sort: order

# Table of contents settings - make TOC less prominent
# Heading anchor links will still work, but TOC won't dominate the page
nav_fold: true

# Footer content

# Google Analytics (optional - remove if not needed)
# ga_tracking: UA-XXXXXXXX-X

# Aux links for the top navigation
# Disabled to keep the header search field visible; GitHub link remains available in `nav_external_links`.
# aux_links:
#   "openAMUNDSEN-DA on GitHub":
#     - "//github.com/franzwagner-uibk/openamundsen_da"

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Footer navigation
footer_nav_enabled: true

# External navigation links
nav_external_links:
  - title: openAMUNDSEN
    url: https://github.com/openamundsen/openamundsen
    hide_icon: false

# Mermaid diagrams support (disabled for GitHub Pages compatibility)
# mermaid:
#   version: "9.1.3"

# Callouts
callouts_level: loud
callouts:
  step:
    title: Goal
    color: blue
  checks:
    title: Checks
    color: blue
  references:
    title: References
    color: purple
  tip:
    title: Tip
    color: blue
  highlight:
    color: yellow
  important:
    title: Resources
    color: blue
  new:
    title: Prerequisites
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red
