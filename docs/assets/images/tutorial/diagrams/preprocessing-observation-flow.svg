<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Preprocessing observation flow</title>
  <desc id="desc">Flow from snow observation products to project summary statistics, per-step observation CSVs and data assimilation.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #000000; stroke-width: 1.6; }
      .t { font-family: Arial, sans-serif; font-size: 22px; fill: #000000; }
      .ts { font-family: Arial, sans-serif; font-size: 18px; fill: #000000; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 17px; fill: #000000; }
      .arrow { stroke: #000000; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#000000" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="520"/>

  <rect class="box" x="150" y="24" width="680" height="78" rx="20" ry="20"/>
  <text class="t" x="490" y="57" text-anchor="middle">Snow observation products</text>
  <text class="ts" x="490" y="83" text-anchor="middle">fSCA and wet snow</text>

  <path class="arrow" d="M490 102 L490 138"/>

  <rect class="box" x="150" y="140" width="680" height="104" rx="20" ry="20"/>
  <text class="t" x="490" y="174" text-anchor="middle">Project summary statistics</text>
  <text class="mono" x="490" y="203" text-anchor="middle">scf_summary.csv</text>
  <text class="mono" x="490" y="227" text-anchor="middle">wet_snow_summary.csv</text>

  <path class="arrow" d="M490 244 L490 280"/>

  <rect class="box" x="150" y="282" width="680" height="122" rx="20" ry="20"/>
  <text class="t" x="490" y="316" text-anchor="middle">Per-step observation CSVs</text>
  <text class="mono" x="490" y="345" text-anchor="middle">steps/step_*/obs/obs_*.csv</text>
  <text class="ts" x="490" y="372" text-anchor="middle">one row per configured assimilation event</text>

  <path class="arrow" d="M490 404 L490 440"/>

  <rect class="box" x="150" y="442" width="680" height="62" rx="20" ry="20"/>
  <text class="t" x="490" y="470" text-anchor="middle">Data assimilation step</text>
  <text class="ts" x="490" y="492" text-anchor="middle">reads the matching observation CSV for the configured event date</text>
</svg>
