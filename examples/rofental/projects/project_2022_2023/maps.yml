maps:
  setup_overview:
    title: setup_overview
    output_name: setup_overview
    layout:
      nrows: 2
      ncols: 3
    defaults:
      show_scalebar: true
    panels:
      - row: 0
        col: 0
        kind: overview
        title: overview
        scale: 2500000
        roi_label: Rofental
      - row: 0
        col: 1
        kind: roi
        title: region of interest
        show_station_marker: true
        show_stations_name: true
        show_stations_elev: true
        below_items:
          - kind: station_symbol
            label: Meteorological stations
      - row: 0
        col: 2
        kind: dem
        title: digital elevation model
      - row: 1
        col: 0
        kind: landcover
        title: landcover
      - row: 1
        col: 1
        kind: hillshade
        title: hillshade
        show_station_marker: true
        show_stations_name: false
      - row: 1
        col: 2
        kind: srf
        title: snow redistribution factor
        show_hillshade: true

  da_1:
    title: da_1
    output_name: da_1
    layout:
      nrows: 1
      ncols: 3
    defaults:
      date: "2022-11-24"
      show_scalebar: true
    panels:
      - row: 0
        col: 0
        kind: snow_depth
        source: open_loop
        title: open loop snow depth
        show_hillshade: true
      - row: 0
        col: 1
        kind: snow_depth
        source: ensemble_mean
        title: ensemble mean snow depth
        show_hillshade: true
      - row: 0
        col: 2
        kind: snow_depth
        source: increment
        title: snow depth increment
        show_hillshade: true

