# Available panel kinds:
# - overview                 # scale: 1000000 ; optional roi_label
# - roi
# - hillshade
# - dem
# - svf
# - srf
# - landcover
# - snow_depth               # source: open_loop | ensemble_mean | increment
# - swe                      # source: open_loop | ensemble_mean | increment
# - liquid_water_content     # source: open_loop | ensemble_mean | increment
# - fsc
# - wet_snow
# - legend
# - colorbar
# Optional panel keys:
# - title, name, date, legend, show_colorbar, show_scalebar, show_grid, show_hillshade
# - show_roi, show_station_marker, show_stations_name, show_stations_elev
# legend: horizontal | vertical

maps:
  rofental_setup_map:
    title: Rofental setup map
    layout:
      nrows: 1
      ncols: 2
    panels:
      - row: 0
        col: 0
        kind: hillshade
        title: Hillshade
        show_station_marker: true
      - row: 0
        col: 1
        kind: landcover
        title: Landcover
        show_station_marker: true

  rofental_static_grids:
    title: Static setup grids
    layout:
      nrows: 2
      ncols: 2
    panels:
      - row: 0
        col: 0
        kind: roi
        title: Region of interest
        show_station_marker: true
        show_stations_name: true
        show_stations_elev: true
      - row: 0
        col: 1
        kind: dem
        title: Digital elevation model
      - row: 1
        col: 0
        kind: svf
        title: Sky view factor
      - row: 1
        col: 1
        kind: srf
        title: Snow redistribution factor

  rofental_setup_story:
    title: Rofental setup story
    layout:
      nrows: 3
      ncols: 2
    panels:
      - row: 0
        col: 0
        kind: overview
        title: Alpine context
        scale: 2500000
        roi_label: Rofental
      - row: 0
        col: 1
        kind: roi
        title: Region of interest
        show_station_marker: true
        show_stations_name: true
        show_stations_elev: true
      - row: 1
        col: 0
        kind: dem
        title: Elevation
      - row: 1
        col: 1
        kind: landcover
        title: Landcover
        show_station_marker: true
      - row: 2
        col: 0
        kind: svf
        title: Sky view factor
      - row: 2
        col: 1
        kind: srf
        title: Snow redistribution factor

  rofental_melt_progression:
    title: Melt progression
    layout:
      nrows: 4
      ncols: 2
    defaults:
      show_scalebar: true
    panels:
      - row: 0
        col: 0
        kind: snow_depth
        source: open_loop
        date: "2023-04-26"
      - row: 0
        col: 1
        kind: snow_depth
        source: ensemble_mean
        date: "2023-04-26"
      - row: 1
        col: 0
        kind: swe
        source: open_loop
        date: "2023-05-18"
      - row: 1
        col: 1
        kind: swe
        source: ensemble_mean
        date: "2023-05-18"
      - row: 2
        col: 0
        kind: liquid_water_content
        source: open_loop
        date: "2023-05-23"
      - row: 2
        col: 1
        kind: liquid_water_content
        source: ensemble_mean
        date: "2023-05-23"
      - row: 3
        col: 0
        kind: wet_snow
        date: "2023-05-23"
      - row: 3
        col: 1
        kind: fsc
        date: "2023-05-26"

  snowdepth_2023-06-02:
    title: Snow depth 2023/06/02
    layout:
      nrows: 1
      ncols: 3
    defaults:
      date: "2023-06-02"
