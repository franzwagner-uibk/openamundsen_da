maps:
  setup_overview:
    title: Setup overview
    output_name: setup_overview
    layout:
      nrows: 1
      ncols: 4
    defaults:
      show_scalebar: true
    panels:
      - row: 0
        col: 0
        kind: dem
        title: Digital elevation model
        show_station_marker: true
        show_stations_name: true
        show_stations_elev: true
        legend_items:
          - kind: station_symbol
            label: AWS
            placement: inside
            anchor: top_left
      - row: 0
        col: 1
        kind: landcover
        title: Land cover
        # Paper figure grouping: merge minor classes into model-relevant Rofental classes.
        landcover_grouping: rofental_manuscript
      - row: 0
        col: 2
        kind: aspect
        title: Aspect
        legend: horizontal
      - row: 0
        col: 3
        kind: srf
        title: Snow redistribution factor
        show_hillshade: true
