maps:
  setup_overview:
    title: Setup overview
    output_name: setup_overview
    layout:
      nrows: 1
      ncols: 3
    defaults:
      show_scalebar: true
    panels:
      - row: 0
        col: 0
        kind: overview
        title: Overview
        scale: 2500000
        roi_label: Rofental
      - row: 0
        col: 1
        kind: dem
        title: Digital elevation model
        show_station_marker: true
        show_stations_name: true
        show_stations_elev: true
        legend_items:
          - kind: station_symbol
            label: Meteorological stations
            placement: inside
            anchor: top_left
      - row: 0
        col: 2
        kind: landcover
        title: Land cover
        landcover_grouping: broad
