maps:
  setup_overview:
    title: setup_overview
    output_name: setup_overview
    layout:
      nrows: 2
      ncols: 3
    defaults:
      show_scalebar: true
    panels:
      - row: 0
        col: 0
        kind: overview
        title: overview
        scale: 2500000
        roi_label: Rofental
      - row: 0
        col: 1
        kind: roi
        title: region of interest
        show_station_marker: true
        show_stations_name: true
        show_stations_elev: true
        below_items:
          - kind: station_symbol
            label: Meteorological stations
      - row: 0
        col: 2
        kind: dem
        title: digital elevation model
      - row: 1
        col: 0
        kind: landcover
        title: landcover
      - row: 1
        col: 1
        kind: hillshade
        title: hillshade
      - row: 1
        col: 2
        kind: srf
        title: snow redistribution factor

  da_3:
    title: da_3
    output_name: da_3
    layout:
      nrows: 1
      ncols: 4
    defaults:
      date: "2023-01-21"
      show_hillshade: true
      show_scalebar: true
    panels:
      - row: 0
        col: 0
        kind: snow_depth
        source: open_loop
        title: open loop snow depth
      - row: 0
        col: 1
        kind: snow_depth
        source: ensemble_mean
        title: ensemble mean snow depth
      - row: 0
        col: 2
        kind: fsc
        title: Sentinel 2 snow cover
      - row: 0
        col: 3
        kind: snow_depth
        source: increment
        title: snow depth increment

  da_6:
    title: da_6
    output_name: da_6
    layout:
      nrows: 1
      ncols: 4
    defaults:
      date: "2023-04-29"
      show_hillshade: true
      show_scalebar: true
    panels:
      - row: 0
        col: 0
        kind: snow_depth
        source: open_loop
        title: open loop snow depth
      - row: 0
        col: 1
        kind: snow_depth
        source: ensemble_mean
        title: ensemble mean snow depth
      - row: 0
        col: 2
        kind: wet_snow
        title: Sentinel 1 wet snow
      - row: 0
        col: 3
        kind: snow_depth
        source: increment
        title: snow depth increment

  da_7:
    title: da_7
    output_name: da_7
    layout:
      nrows: 2
      ncols: 3
    defaults:
      date: "2023-05-03"
      show_hillshade: true
      show_scalebar: true
    panels:
      - row: 0
        col: 0
        kind: snow_depth
        source: open_loop
        title: open loop snow depth
      - row: 0
        col: 1
        kind: snow_depth
        source: ensemble_mean
        title: ensemble mean snow depth
      - row: 0
        col: 2
        kind: snow_depth
        source: increment
        title: snow depth increment
      - row: 1
        col: 0
        kind: fsc
        title: Sentinel 2 snow cover
      - row: 1
        col: 1
        kind: wet_snow
        title: Sentinel 1 wet snow
      - row: 1
        col: 2
        kind: liquid_water_content
        source: increment
        title: liquid water content increment

  da_10:
