# Result overview configuration.
#
# Discovery:
# - Keep this file in the project root directory.
# - When present, the pipeline uses this panel list for
#   results/plots/results/result_overview.png.
# - When absent, the built-in default result overview panel list is used.
#
# Structure:
# - panels: ordered list from top to bottom
#
# Supported panel values:
# - fSC
# - WSF
# - WSLA
# - roi-swe
# - roi-sd
# - station-swe
# - station-sd
# - ess
# - scores-crpss
# - scores-ner
#
# Supported keys per panel entry:
# - panel: required
# - station_id: required only for station-swe / station-sd
# - title: optional custom panel title override
# - show_obs: optional, default true
#
# Notes:
# - YAML order is preserved in the plot.
# - Station ids must match the station metadata table for the project setup.
# - Observation markers/lines are only shown when show_obs is true.
# - weights.station_colors can pin optional weights-plot station colors.
#
# Current active example:
panels:
  - panel: fSC
    show_obs: true
    title: Fractional snow covered area (fSCA)

  - panel: WSF
    show_obs: true
    title: Wet snow fraction (WSF)

  - panel: WSLA
    show_obs: true
    title: Wet snow line altitude

  - panel: station-sd
    station_id: proviantdepot
    title: Snow depth (Proviantdepot 2659 m)
    show_obs: true

  - panel: ess

  - panel: scores-crpss

weights:
  station_colors:
    station_hs:
      proviantdepot: station_hs

