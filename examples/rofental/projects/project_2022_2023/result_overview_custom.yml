# Custom result overview configuration.
#
# Discovery:
# - Keep this file in the project root directory.
# - When present, the pipeline writes results/plots/results/result_overview_custom.png.
# - When absent, no custom overview is written.
#
# Structure:
# - panels: ordered list from top to bottom
#
# Supported panel values:
# - fSC
# - fWS
# - roi-swe
# - roi-sd
# - station-swe
# - station-sd
# - ess
# - scores-crpss
# - scores-ner
# - scores-zskill
#
# Supported keys per panel entry:
# - panel: required
# - station_id: required only for station-swe / station-sd
# - title: optional custom panel title override
# - show_obs: optional, default true
#
# Notes:
# - YAML order is preserved in the plot.
# - Station ids must match the station metadata table for the project setup.
# - Observation markers/lines are only shown when show_obs is true.
#
# Current active example:
panels:
  - panel: fSC
    show_obs: true
    title: snow cover fraction Rofental catchment - openAMUNDSEN ensemble and satellite data

  - panel: fWS
    show_obs: true
    title: wet snow fraction Rofental catchment - openAMUNDSEN ensemble and satellite data

  - panel: station-sd
    station_id: proviantdepot
    title: snow depth Proviantdepot 2659 m - openAMUNDSEN ensemble and station observation
    show_obs: true

  - panel: ess

  - panel: scores-crpss

