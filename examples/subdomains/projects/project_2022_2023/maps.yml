maps:
  subdomain_example_setup_overview:
    title: Subdomain example setup overview
    output_name: setup_overview
    layout:
      nrows: 2
      ncols: 3
    defaults:
      show_scalebar: true
    panels:
      - row: 0
        col: 0
        kind: overview
        title: overview
        scale: 2500000
        roi_label: Subdomain ROI
      - row: 0
        col: 1
        kind: roi
        title: ROI and stations
        show_station_marker: true
        show_stations_name: false
        show_stations_elev: false
        below_items:
          - kind: station_symbol
            label: Meteo and snow stations
      - row: 0
        col: 2
        kind: dem
        title: elevation
      - row: 1
        col: 0
        kind: landcover
        title: land cover
      - row: 1
        col: 1
        kind: hillshade
        title: terrain shading
        show_station_marker: true
        show_stations_name: false
      - row: 1
        col: 2
        kind: srf
        title: snow redistribution factor
        show_hillshade: true
