[project]
name = "openamundsen-da"
version = "1.0.0"
description = "Data assimilation extension for openAMUNDSEN"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Franz Wagner", email = "franz.wagner@uibk.ac.at" },
]
maintainers = [
  { name = "Franz Wagner", email = "franz.wagner@uibk.ac.at" },
]
keywords = [
  "data assimilation",
  "openAMUNDSEN",
  "particle filter",
  "snow hydrology",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "openamundsen>=1.1",
  "numpy>=1.24",
  "pandas>=1.5",
  "boto3>=1.34",
  "loguru>=0.7",
  "geopandas>=0.14",
  "rasterio>=1.3",
  "xarray>=2023.0",
  "netCDF4>=1.6",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.17",
  "matplotlib>=3.7",
  "psutil>=5.9",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.urls]
Documentation = "https://openamundsen-da.pages.dev/"
Repository = "https://github.com/franzwagner-uibk/openamundsen_da"
Issues = "https://github.com/franzwagner-uibk/openamundsen_da/issues"

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
oa-da-scf = "openamundsen_da.observer.satellite_scf:cli_main"
oa-da-snowcover = "openamundsen_da.observer.snowcover:cli_main"
oa-da-scf-uncertainty = "openamundsen_da.observer.scf_uncertainty:cli_main"
oa-da-wetsnow = "openamundsen_da.observer.wetsnow:cli_main"
oa-da-wetsnow-uncertainty = "openamundsen_da.observer.wetsnow_uncertainty:cli_main"
oa-da-hrwsi-download = "openamundsen_da.observer.hrwsi_download:cli_main"
oa-da-plot-scf = "openamundsen_da.methods.viz.plots.observer.scf_summary:cli_main"
oa-da-project = "openamundsen_da.pipeline.project:cli"
oa-da-benchmark = "openamundsen_da.benchmark.pipeline:cli"
oa-da-model-scf = "openamundsen_da.methods.h_of_x.model_scf:cli_main"
oa-da-model-scf-project-daily = "openamundsen_da.methods.h_of_x.model_scf:cli_project_daily"
oa-da-assimilate-scf = "openamundsen_da.methods.pf.assimilate_fraction:cli_main"
oa-da-assimilate-wet-snow = "openamundsen_da.methods.pf.assimilate_fraction:cli_main_wet_snow"
oa-da-plot-result-overview = "openamundsen_da.methods.viz.plots.result_overview:cli_main"
oa-da-plot-project-plots = "openamundsen_da.methods.viz.plots:cli_main"
oa-da-plot-project-maps = "openamundsen_da.methods.viz.maps:cli_main"
oa-da-plot-multi-project-snow = "openamundsen_da.methods.viz.plots.multi_project_snow:cli_main"
oa-da-project-pdf = "openamundsen_da.methods.viz.reports:cli_main"
oa-da-fetch-overview-geojson = "openamundsen_da.methods.viz.maps.overview:cli_main"
oa-da-plot-weights = "openamundsen_da.methods.viz.plots.assimilation.weights:cli_main"
oa-da-plot-ess = "openamundsen_da.methods.viz.plots.assimilation.ess_timeline:cli_main"
oa-da-resample = "openamundsen_da.methods.pf.resample:cli_main"
oa-da-model-wet-snow = "openamundsen_da.methods.wet_snow.area:cli_model"
oa-da-model-wet-snow-project-daily = "openamundsen_da.methods.wet_snow.area:cli_model_project"
oa-da-wetsnow-project = "openamundsen_da.observer.satellite_wet_snow_s1:cli_main"
oa-da-perf-monitor = "openamundsen_da.util.perf_monitor:cli_main"
oa-da-clean-project = "openamundsen_da.pipeline.cleanup:cli_main"
oa-da-prepare-project-obs = "openamundsen_da.pipeline.prepare_project_obs:cli_main"
oa-da-project-skeleton = "openamundsen_da.pipeline.project_skeleton:cli"
oa-da-merge-project-grids = "openamundsen_da.pipeline.merge_project_grids:cli_main"
oa-da-subdomain = "openamundsen_da.subdomain.cli:cli"
