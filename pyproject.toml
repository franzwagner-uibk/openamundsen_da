[project]
name = "openamundsen-da"
version = "1.0.0"
description = "Data assimilation extension for openAMUNDSEN"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Franz Wagner", email = "franz.wagner@uibk.ac.at" },
]
maintainers = [
  { name = "Franz Wagner", email = "franz.wagner@uibk.ac.at" },
]
keywords = [
  "data assimilation",
  "openAMUNDSEN",
  "particle filter",
  "snow hydrology",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "openamundsen>=1.1",
  "numpy>=1.24",
  "pandas>=1.5",
  "boto3>=1.34",
  "loguru>=0.7",
  "geopandas>=0.14",
  "rasterio>=1.3",
  "xarray>=2023.0",
  "netCDF4>=1.6",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.17",
  "matplotlib>=3.7",
  "psutil>=5.9",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.urls]
Documentation = "https://openamundsen-da.pages.dev/"
Repository = "https://github.com/franzwagner-uibk/openamundsen_da"
Issues = "https://github.com/franzwagner-uibk/openamundsen_da/issues"

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["openamundsen_da*"]

[project.scripts]
openamundsen-da = "openamundsen_da.cli:main"
